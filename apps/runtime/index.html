<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocketcrab Nova Runtime</title>
    <style>
      /* Minimal, secret-free runtime page: a status bar plus the game frame. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #bar {
        font:
          11px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #94a3b8;
        background: #0f172a;
        padding: 4px 8px;
      }
      #game-container {
        height: calc(100% - 24px);
      }
      #game-container iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="bar">runtime origin — waiting for bootstrap</div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
