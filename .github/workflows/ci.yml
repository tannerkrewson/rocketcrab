name: CI

on:
    push:
        branches-ignore:
            - prod

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test
