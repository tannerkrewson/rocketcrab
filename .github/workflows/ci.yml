name: CI

on:
    push:
        branches-ignore:
            - prod

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
            - run: npm ci
            - name: Format check
              run: npm run format:check
            - name: Lint
              run: npm run lint
            - name: Type check
              run: npm run type-check
            - name: Test
              run: npm test
            - name: Build
              run: npm run build
