name: CI

on:
  push:
    branches: [nova]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (format, lint, type, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json pins and fails if
      # package.json and package-lock.json have drifted (lockfile enforcement).
      - name: Install dependencies
        run: npm ci

      # Generated files (TanStack Router routeTree.gen.ts) are excluded from
      # oxfmt/oxlint via .oxfmtrc.json / .oxlintrc.json; CI runs the same
      # configs as local `npm run check` so results match.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Infrastructure worker tests
        run: npm run test:deploy

      - name: Build
        run: npm run build

      - name: Bundle-size report (warn-only)
        run: npm run bundle:size

      # The two static origins are produced as separate artifacts.
      - name: Upload Nova bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-dist
          path: apps/nova/dist
          if-no-files-found: error

      - name: Upload Runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dist
          path: apps/runtime/dist
          if-no-files-found: error

  e2e:
    name: Playwright browser tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
