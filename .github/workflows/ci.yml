name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rerun checks and the deploy on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main: its run may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks (format, lint, type, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json pins and fails if
      # package.json and package-lock.json have drifted (lockfile enforcement).
      - name: Install dependencies
        run: npm ci

      # Generated files (TanStack Router routeTree.gen.ts) are excluded from
      # oxfmt/oxlint via .oxfmtrc.json / .oxlintrc.json; CI runs the same
      # configs as local `npm run check` so results match.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Verify the same app bundle and Worker config used for the production deploy.
      - name: Nova Worker deployment check
        run: npm run check:deploy

      - name: Build runtime
        run: npm run build --workspace @rocketcrab/runtime

      - name: Bundle-size report (warn-only)
        run: npm run bundle:size

      # The two static origins are produced as separate artifacts.
      - name: Upload Nova bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-dist
          path: apps/nova/dist
          if-no-files-found: error

      - name: Upload Runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dist
          path: apps/runtime/dist
          if-no-files-found: error

  e2e:
    name: Playwright browser tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run Trystero transport browser tests (Chromium)
        run: npm run test:e2e:trystero -- --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Deploys each Worker whose inputs changed since its live version, after
  # the checks pass. The e2e job doesn't gate it (see PLAN.md).
  deploy:
    name: Deploy changed Workers
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # deploy-changed diffs against the commit each Worker was built from.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: node scripts/deploy-changed.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f82d64d09da6cb5a0afa0120033a7e13
