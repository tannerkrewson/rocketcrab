name: CI

on:
    push:
        branches-ignore:
            - prod

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm i
            - run: npm run type-check
            - run: npm run build
            - run: npm run lint
            - run: npm test
