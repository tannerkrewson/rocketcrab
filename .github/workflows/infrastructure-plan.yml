# Non-mutating checks for repository-managed Cloudflare infrastructure.
# OpenTofu is the intended source of truth for supported Cloudflare resources;
# this workflow never runs apply and never deploys with Wrangler.
name: Validate OpenTofu infrastructure

on:
  pull_request:
    paths:
      - deploy/opentofu/**
      - deploy/relay/**
      - deploy/turn-creds/**
      - .github/workflows/infrastructure-plan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: OpenTofu fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0

      - name: Build Worker bundles without upload
        run: |
          npx --yes wrangler@4.127.1 deploy deploy/relay/worker.ts \
            --config deploy/relay/wrangler.toml \
            --dry-run --outdir deploy/opentofu/.build/relay
          npx --yes wrangler@4.127.1 deploy deploy/turn-creds/worker.ts \
            --config deploy/turn-creds/wrangler.toml \
            --dry-run --outdir deploy/opentofu/.build/turn-creds

      - name: Check OpenTofu formatting
        run: tofu -chdir=deploy/opentofu fmt -check -diff

      - name: Initialize providers without a backend
        run: tofu -chdir=deploy/opentofu init -backend=false -input=false

      - name: Validate configuration
        run: tofu -chdir=deploy/opentofu validate

      - name: Generate static no-refresh plan
        run: >-
          tofu -chdir=deploy/opentofu plan -refresh=false -input=false
          -var=cloudflare_account_id=00000000000000000000000000000000
