name = "rocketcrab"
main = "worker.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[vars]
TURNSTILE_REQUIRED = "true"

[assets]
directory = "../../apps/nova/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[durable_objects.bindings]]
name = "SIGNAL_HUB"
class_name = "SignalHub"

[[durable_objects.bindings]]
name = "TUNNEL_PAIR"
class_name = "TunnelPair"

[[durable_objects.bindings]]
name = "PARTY_CODE"
class_name = "PartyCode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalHub", "TunnelPair", "PartyCode"]

[dev]
port = 2724
inspector_port = 2727

# Per-client (IPv4 address or IPv6 /64), per-route limits. Counters are
# approximate and per Cloudflare location: a backstop, not the abuse defence
# (that is the same-origin check plus the per-socket budgets in signal.ts and
# tunnel.ts).
# Strict: /api/turn, /api/relay and /api/code/*. One TURN mint per player per
# party; party-code lookups are guessable, so they stay strict too.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Bulk: /api/signal and /api/tunnel. Sized for a big party behind one school or
# carrier-NAT address where WebRTC is blocked: every player opens a tunnel to
# each of up to nine direct neighbours.
[[ratelimits]]
name = "BULK_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 2000, period = 60 }

[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Secrets (never in this file): TURN_KEY_ID, TURN_KEY_API_TOKEN, TURNSTILE_SECRET_KEY.
# Set with `npx wrangler secret put <NAME> --config deploy/nova/wrangler.toml`.
