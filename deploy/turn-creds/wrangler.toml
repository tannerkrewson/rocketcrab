# Cloudflare Workers config for the TURN credential mint endpoint
# (beads rocketcrab-23s). See README.md for deploy steps and secrets.
name = "rocketcrab-turn-creds"
main = "worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# TURN_BUDGET KV namespace: mint counters (mints:YYYY-MM-DD, mints:total) for
# the budget kill-switch (rocketcrab-23s.4). Create it once, then paste the id:
#   wrangler kv namespace create TURN_BUDGET
# The placeholder below makes `wrangler dev` use the local KV simulator and
# `wrangler deploy` fail until the real id is set (by design).
kv_namespaces = [{ binding = "TURN_BUDGET", id = "REPLACE_WITH_KV_NAMESPACE_ID" }]
