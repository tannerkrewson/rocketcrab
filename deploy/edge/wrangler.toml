# The single Nova edge Worker (TURN mint + Classic CORS relay).
# OpenTofu deploys this bundle and owns bindings; this file is for local
# `wrangler dev` and the dry-run bundle OpenTofu consumes.
name = "rocketcrab-cors-relay"
main = "worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Platform rate-limit binding (same shape OpenTofu provisions). Local
# `wrangler dev` simulates it; the in-memory limiter is only a test fallback.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
