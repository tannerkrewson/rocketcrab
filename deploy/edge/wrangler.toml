# Nova edge Worker: TURN mint, Classic CORS relay, signaling, tunnel, log.
# This file is the single source of truth for the deployed Worker.
# Deploy with `npm run edge:deploy`; see deploy/cloudflare.md.
name = "rocketcrab-edge"
main = "worker.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "SIGNAL_HUB"
class_name = "SignalHub"

[[durable_objects.bindings]]
name = "TUNNEL_PAIR"
class_name = "TunnelPair"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TunnelPair"]

[vars]
# Exact origins allowed to call the Worker. Localhost lets `npm run dev`
# use the deployed Worker; non-browser clients can't be stopped by Origin
# anyway, so this only keeps other websites from using it.
ORIGIN_ALLOWLIST = "https://rocketcrab.com,https://rocketcrab-nova.tannerkrewson.workers.dev,http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:5173"

# Per-IP, per-route limits. Counters are approximate and per Cloudflare
# location: a backstop, not the abuse defence (that is the Origin gate plus
# the per-socket budgets in signal.ts and tunnel.ts).
# Strict: /turn and the Classic relay. One TURN mint per player per party.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Bulk: /signal, /tunnel, /log. Sized for a big party behind one school or
# carrier-NAT address where WebRTC is blocked: every player opens a tunnel to
# each of up to nine direct neighbours and logs each attempt.
[[ratelimits]]
name = "BULK_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 2000, period = 60 }

# Keep console.log output (including turn_cred_mint lines) in Workers Logs.
[observability]
enabled = true

# Secrets (never in this file): TURN_KEY_ID, TURN_KEY_API_TOKEN.
# Set with `npx wrangler secret put <NAME> --config deploy/edge/wrangler.toml`.
