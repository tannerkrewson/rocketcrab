<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spike: Nova host (origin A)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 8px 12px;
        background: #101828;
        color: #fff;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
      }
      #status {
        font-variant-numeric: tabular-nums;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #d1d5db;
      }
      button {
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      #emergency-stop {
        background: #dc2626;
        color: #fff;
        font-weight: 700;
      }
      #runtime-frame {
        flex: 1;
        border: 0;
        width: 100%;
        min-height: 0;
      }
      pre#log {
        height: 96px;
        overflow: auto;
        background: #111;
        color: #7dd3fc;
        font-size: 11px;
        margin: 0;
        padding: 6px 10px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Nova host (origin A) — runtime sandbox spike</h1>
      <span id="status">not bootstrapped</span>
    </header>
    <main>
      <div id="toolbar">
        <button id="emergency-stop" type="button">🛑 Emergency stop</button>
        <button id="reload" type="button">Reload game (soft)</button>
        <button id="restart" type="button">Restart runtime (hard)</button>
        <button id="load-hello" type="button">Load hello game</button>
        <button id="load-infinite" type="button">Load infinite game</button>
        <button id="load-malicious" type="button">Load malicious game</button>
      </div>
      <iframe
        id="runtime-frame"
        title="runtime"
        allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
        allowfullscreen
      ></iframe>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
