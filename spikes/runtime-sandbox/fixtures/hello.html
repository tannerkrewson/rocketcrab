<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spike: hello capabilities</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      canvas,
      img {
        border: 1px solid #ccc;
        margin: 4px;
        display: block;
      }
      /* Physical-device pass: on-screen results so silent probes are
         observable on a phone (no JS console in iPhone Safari). */
      #probe-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 9999;
        max-width: 78vw;
        max-height: 62vh;
        overflow: auto;
        background: rgba(17, 24, 39, 0.85);
        color: #e2e8f0;
        font:
          11px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        padding: 6px 10px;
        border-radius: 8px;
        pointer-events: none;
        white-space: pre;
      }
      #probe-panel .ok {
        color: #4ade80;
      }
      #probe-panel .bad {
        color: #f87171;
      }
      #probe-panel .info {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <h1>hello (capability probe)</h1>
    <script>
      window.__inlineClassic = true;
    </script>
    <canvas id="c" width="120" height="60"></canvas>
    <canvas id="gl" width="120" height="60"></canvas>
    <img id="img" alt="remote image" />
    <input type="file" id="file" />
    <button id="clickme" type="button">tap for audio / fullscreen / pointer lock</button>
    <div id="probe-panel"></div>
    <script type="module">
      const results = {};
      function renderPanel() {
        const panel = document.getElementById("probe-panel");
        if (!panel) return;
        const lines = Object.entries(window.__results).map(([k, v]) => {
          const bad =
            v === false || v === null || (typeof v === "string" && /^(error|denied)/.test(v));
          const ok =
            !bad && (v === true || (v && typeof v === "object" && Object.keys(v).length > 0));
          const mark = bad ? "✗" : ok ? "✓" : "·";
          const cls = bad ? "bad" : ok ? "ok" : "info";
          return `<span class="${cls}">${mark}</span> ${k}: ${JSON.stringify(v)}`;
        });
        panel.innerHTML =
          (lines.length ? lines.join("\n") : "waiting for probes…") +
          `\n<span class="info">updated ${new Date().toLocaleTimeString()}</span>`;
      }
      const done = () => {
        window.__results = { ...results };
        renderPanel();
      };
      const report = (k, v) => {
        results[k] = v;
        done();
      };

      // ---- synchronous setup (runs before any await) ----
      window.__moduleReady = false;
      const canvas = document.getElementById("c");
      const glCanvas = document.getElementById("gl");
      const img = document.getElementById("img");
      const file = document.getElementById("file");
      const clickme = document.getElementById("clickme");

      // Web Audio: create the context eagerly; resume on a user gesture.
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const actx = new AC();
        window.__audioCtx = actx;
        results.audioInitialState = actx.state;
        clickme.addEventListener("click", () => {
          actx
            .resume()
            .then(() => {
              report("audioAfterGesture", actx.state);
              // Audible proof for the physical-device pass: short tone.
              try {
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.type = "sine";
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.15, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
                osc.connect(gain).connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.65);
              } catch (e) {
                report("audioBeep", "error:" + String(e));
              }
            })
            .catch((e) => report("audioAfterGesture", "error:" + String(e)));
        });
      } catch (e) {
        report("audioSetup", false);
      }

      // Clipboard needs user activation inside the sandboxed frame.
      clickme.addEventListener("click", async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText("nova-clipboard-spike");
            report("clipboardWrite", true);
          } else {
            report("clipboardWrite", "unsupported");
          }
        } catch (e) {
          report("clipboardWrite", false);
          report("clipboardError", String(e));
        }
      });

      clickme.addEventListener("click", async () => {
        try {
          await canvas.requestFullscreen();
          report("fullscreen", document.fullscreenElement === canvas);
        } catch (e) {
          report("fullscreen", false);
        }
        try {
          await canvas.requestPointerLock();
          report("pointerLock", document.pointerLockElement === canvas);
        } catch (e) {
          report("pointerLock", false);
        }
      });

      file.addEventListener("change", () => {
        const f = file.files && file.files[0];
        if (!f) {
          report("fileInput", false);
          return;
        }
        const reader = new FileReader();
        reader.onload = () =>
          report("fileInput", String(reader.result).includes("HELLO-FROM-SPIKE"));
        reader.readAsText(f);
      });

      window.__orientationSeen = null;
      window.addEventListener("deviceorientation", (e) => {
        window.__orientationSeen = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
        report("orientation", window.__orientationSeen);
      });
      // iOS 13+ requires a user-gesture permission request before
      // deviceorientation events fire. Physical-device pass needs this
      // tappable from the phone (no JS console); whether the prompt works
      // from inside the sandboxed runtime iframe is itself a finding.
      const orientBtn = document.createElement("button");
      orientBtn.type = "button";
      orientBtn.textContent = "tap to request orientation permission";
      clickme.insertAdjacentElement("afterend", orientBtn);
      orientBtn.addEventListener("click", async () => {
        try {
          const DE = window.DeviceOrientationEvent;
          if (DE && typeof DE.requestPermission === "function") {
            const perm = await DE.requestPermission();
            report("orientationPermission", perm);
            report("orientation", `permission ${perm} — rotate the phone`);
          } else {
            report("orientationPermission", "no-request-api");
            report("orientation", window.__orientationSeen ?? "no events yet — rotate the phone");
          }
        } catch (e) {
          report("orientationPermission", "error:" + String(e));
          report("orientation", "error:" + String(e));
        }
      });

      window.__visibilityChanges = 0;
      document.addEventListener("visibilitychange", () => {
        window.__visibilityChanges += 1;
      });

      // ---- async probes ----
      report("inlineModule", true);

      try {
        const { v4 } = await import("https://cdn.jsdelivr.net/npm/uuid@9.0.1/+esm");
        report("esmJsdelivr", typeof v4 === "function" && typeof v4() === "string");
      } catch (e) {
        report("esmJsdelivr", false);
        report("esmJsdelivrError", String(e));
      }

      try {
        const r = await fetch("https://cdn.jsdelivr.net/npm/uuid@9.0.1/package.json");
        const j = await r.json();
        report("fetchRemote", r.ok && typeof j.name === "string");
      } catch (e) {
        report("fetchRemote", false);
        report("fetchError", String(e));
      }

      // WebSocket probe: local wss echo on the same host, port 5276 (origin
      // port swap, same pattern as the runtime origin).
      try {
        const wsUrl = location.origin.replace(/:\d+$/, ":5276").replace(/^http/, "wss");
        const ws = new WebSocket(wsUrl);
        const wsT0 = performance.now();
        ws.addEventListener("open", () => ws.send("nova-ws-spike"));
        ws.addEventListener("message", (ev) => {
          const ok = ev.data === "nova-ws-spike";
          report("wsEcho", ok);
          if (ok) report("wsLatencyMs", Math.round(performance.now() - wsT0));
          ws.close();
        });
        ws.addEventListener("error", () => {
          report("wsEcho", false);
          report("wsError", "open/error — is the :5276 echo server running?");
        });
        // fail-safe so the probe never hangs the panel
        setTimeout(() => {
          if (ws.readyState !== WebSocket.CLOSED) ws.close();
        }, 8000);
      } catch (e) {
        report("wsEcho", false);
        report("wsError", String(e));
      }

      report(
        "remoteImage",
        await new Promise((resolve) => {
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = "https://placehold.co/120x60/png?text=ok";
        }),
      );

      try {
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ff6600";
        ctx.fillRect(0, 0, 120, 60);
        const px = ctx.getImageData(60, 30, 1, 1).data;
        report("canvas2d", px[0] === 255 && px[1] === 102);
      } catch (e) {
        report("canvas2d", false);
      }

      try {
        const gl = glCanvas.getContext("webgl") || glCanvas.getContext("experimental-webgl");
        report("webgl", Boolean(gl && gl.getParameter(gl.VERSION)));
        if (!gl) report("webglError", "no context returned");
      } catch (e) {
        report("webgl", false);
        report("webglError", String(e));
      }

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText("nova-clipboard-spike");
          report("clipboardWrite", true);
        } else {
          report("clipboardWrite", "unsupported");
        }
      } catch (e) {
        report("clipboardWrite", false);
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        report("media", {
          video: stream.getVideoTracks().length > 0,
          audio: stream.getAudioTracks().length > 0,
        });
        stream.getTracks().forEach((t) => t.stop());
      } catch (e) {
        report("media", false);
        report("mediaError", String(e));
        report("mediaDevices", typeof navigator.mediaDevices?.getUserMedia === "function");
      }

      window.__moduleReady = true;
      done();
    </script>
  </body>
</html>
