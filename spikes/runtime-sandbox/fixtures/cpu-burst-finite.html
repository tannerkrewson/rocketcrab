<!doctype html>
<html lang="en">
  <body>
    <script>
      // Heavy but FINITE synchronous CPU burst (~6s). In a browser without
      // process isolation for the frame this blocks the shared main thread,
      // then recovers on its own. Proves transient CPU exhaustion does not
      // permanently break the runtime session.
      window.__burstStarted = true;
      const t0 = performance.now();
      let x = 0;
      while (performance.now() - t0 < 6000) {
        x += 1;
      }
      window.__burstDone = true;
    </script>
  </body>
</html>
