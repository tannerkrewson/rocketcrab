<!doctype html>
<html lang="en">
  <body>
    <script>
      window.__wsResult = "pending";
      try {
        const ws = new WebSocket("wss://localhost:5276");
        ws.onopen = () => {
          ws.send("ping-ws");
        };
        ws.onmessage = (e) => {
          window.__wsResult = e.data === "ping-ws" ? "echo-ok" : "echo-mismatch:" + String(e.data);
          ws.close();
        };
        ws.onerror = () => {
          window.__wsResult = "ws-error";
        };
        setTimeout(() => {
          if (window.__wsResult === "pending") {
            window.__wsResult = "ws-timeout";
            ws.close();
          }
        }, 15000);
      } catch (e) {
        window.__wsResult = "ws-throw:" + String(e);
      }
    </script>
  </body>
</html>
