<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Load counter</title>
  </head>
  <body>
    <output id="load-state">waiting</output>
    <button id="increment">Increment</button>
    <button id="increment-without-payload">Increment without payload</button>
    <script type="module">
      nova.defineGame({
        title: "Load counter",
        mode: "state",
        version: "1.0.0",
        createInitialState: () => ({ count: 0 }),
        actions: {
          increment: (draft) => {
            draft.count += 1;
          },
        },
      });
      nova.state.onChange((view) => {
        document.querySelector("#load-state").textContent = String(view.count);
      });
      function increment(action) {
        nova.dispatch(action).catch((error) => {
          document.querySelector("#load-state").dataset.error = String(error);
        });
      }
      document.querySelector("#increment").addEventListener("click", () => {
        increment({ type: "increment", payload: {} });
      });
      document.querySelector("#increment-without-payload").addEventListener("click", () => {
        increment({ type: "increment" });
      });
      nova.ready();
    </script>
  </body>
</html>
